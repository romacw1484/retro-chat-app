<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

    <div class="main-wrapper">

        <div class="header-container">
            <h1 class="retro-title">
                <span class="retro-text">Retro</span>
                <span class="chat-text">Chat</span>
            </h1>
        </div>

        <div class="login-container">
            <form method="POST" action="{{ url_for('login') }}">
                <h2>Login</h2>
                <div class="form__group field">
                    <input type="text" class="form__field" placeholder="Username" name="username" id="username" required>
                    <label for="username" class="form__label">Username</label>
                </div>
                <div class="form__group field">
                    <input type="password" class="form__field" placeholder="Password" name="password" id="password" required>
                    <label for="password" class="form__label">Password</label>
                </div>
                <button type="submit">Login</button>
            </form>
            <a href="{{ url_for('signup') }}">Don't have an account? Sign up here.</a>
        </div>
      
      <p class="app-description">
                Step back in time with Retro Chat, your go-to for a nostalgic chat experience!
                Enjoy old-school terminal vibes, real-time messaging, and a simple interface.
                Enter your credentials below to start chatting.
            </p>

    </div>
  
  

</body>
</html>
